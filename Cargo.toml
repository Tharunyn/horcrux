[package]
name = "horcrux"
version = "0.1.0"
edition = "2024"
description = "Offline Threshold Key Management System for Blockchain Private Keys"
license = "MIT"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
bincode = "3"
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
bitcoincore-rpc = "0.19.0"
bs58 = "0.5"
clap = { version = "4.6", features = ["derive"] }
cosmrs = { version = "0.22", default-features = false, features = ["rpc", "tokio"] }
dotenvy = "0.15"
crossterm = "0.29"
ed25519-dalek = { version = "3.0", features = ["rand_core", "zeroize"] }
frost-ed25519 = "3.0.0"
frost-secp256k1-tr = "3.0.0"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
k256 = { version = "0.14", features = ["schnorr"] }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rqrr = { version = "0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
solana-commitment-config = "3"
solana-hash = "4"
solana-message = { version = "3", features = ["bincode"] }
solana-pubkey = "4"
solana-rpc-client = "=3.0.7"
solana-signature = { version = "3", features = ["verify"] }
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = { version = "3", features = ["bincode"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tui-input = { version = "0.15", features = ["crossterm"] }
vsss-rs = "6.0.1"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"
solana-rpc-client-api = "=3.0.7"
tempfile = "3"
